# 山石 StoneOS
# 真机经验(生产环境验证)：配置模式 configure；保存配置 save(无确认交互，配置模式内执行)；
# 错误输出为 "% " 前缀样式(生产用错误正则 ^%\s——%后空白可排除 %TAG 样式日志行)
# 已知特征：HA 主备提示符后缀 ~(M)# / ~(B)#；命令行编辑退格怪癖已在过滤器内置处理
vendor: hillstone
save_config_cmd: save
error_patterns:
  - name: hillstone-percent-error
    pattern: '^%\s'
