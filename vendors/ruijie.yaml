# 锐捷 RGOS(官方手册核对：RGOS 11.4(1)B42 与 12.5/12.6 系列共5份配置指南)
# 提示符体系(官方§1.3.2，与Cisco同构)：Ruijie> → enable(特权口令，interceptor.Password
#   可处理) → Ruijie# → Ruijie(config)#；InConfigMode 对锐捷生效
# 错误样式(官方§1.3.6，与Cisco IOS完全一致，由全局cisco-*规则覆盖，无需厂商级规则)：
#   % Ambiguous command: "show c" / % Invalid input detected at '^' marker. / % Incomplete command.
#   (RGOS 12.5/12.6 四份手册同样收录 % Invalid input detected 样式)
# 保存配置(官方)：write(11.x："执行write命令或copy running-config startup-config"；
#   12.x："保存配置write操作")，执行模式直接执行、无确认交互
# 分页(官方确认)：terminal length screen-length 配置单屏最大行数(缺省24行)，
#   12.x 四份手册收录；terminal length 0 关闭分页(与Cisco同构)；
#   Space 滚一页/Return 滚一行，More 拦截器兜底有效
vendor: ruijie
paging_disable: "terminal length 0"
save_config_cmd: "write"
